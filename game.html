<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Kudzu Survivors: Holiday Overtime</title>
  <meta name="description" content="A Moorhead Bros. holiday clearing operation. Survive the festive overgrowth. (Then go RSVP.)">
  <meta name="theme-color" content="#2a1f1a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Pinyon+Script&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1f1a; }
    #ks-canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body data-no-sound-button>
  <canvas id="ks-canvas" aria-label="Kudzu Survivors game area"></canvas>
  <div id="ks-ui"></div>
  <a id="ks-rsvp" class="ks-rsvp" href="index.html#rsvp">&larr; RSVP</a>
  <noscript><p style="color:#efe2c4;font-family:Georgia,serif;padding:16px">Kudzu Survivors needs JavaScript. <a style="color:#c9993b" href="index.html#rsvp">Back to the RSVP</a></p></noscript>

  <!-- Fresh ?v= each visit so browsers never run a stale copy. Order is binding (CONTRACT §1.1). -->
  <script>
    (function () {
      var v = Date.now();
      var list = ["js/sound.js", "js/game/core.js", "js/game/audio.js", "js/game/meta.js", "js/game/weapons.js", "js/game/weapons_evo.js",
                  "js/game/items.js", "js/game/levelup.js", "js/game/enemies.js", "js/game/bosses.js", "js/game/maps.js", "js/game/ui.js", "js/game/test.js"];
      var m = /[?&]skip=([a-z0-9_,]+)/.exec(location.search);
      var skip = m ? m[1].split(",") : [];
      list = list.filter(function (src) {
        for (var i = 0; i < skip.length; i++) if (src === "js/game/" + skip[i] + ".js") return false;
        return true;
      });
      function boot() { if (window.KS && !window.KS._booted) window.KS.boot(); }
      list.forEach(function (src, i) {
        var s = document.createElement("script");
        s.src = src + "?v=" + v;
        s.async = false;
        s.onerror = function () { (window.KS_LOAD_ERRORS = window.KS_LOAD_ERRORS || []).push(src); if (i === list.length - 1) boot(); };
        if (i === list.length - 1) s.onload = boot;
        document.body.appendChild(s);
      });
    })();
  </script>
</body>
</html>
